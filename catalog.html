<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="mystyle.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,100..900;1,9..144,100..900&display=swap" rel="stylesheet">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,100..900;1,9..144,100..900&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">

    <link
        href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css"
        rel="stylesheet"
    />

</head>

<body>
    <div class="navbar">
        <div class="navbar-left">
        <h1>TerraGoods</h1>
        </div>

        <div class="navbar-middle">
        <a href="1">Product</a>
        <a href="2">Sustainability</a>
        <a href="3">Our Story</a>
        <a href="4">Contact</a>
        </div>

        <div class="navbar-right">
        <input type="text" id="search-input" placeholder="Search for our product">

        <div id="cart">
        <i class="ri-shopping-bag-line"></i>
        <span class="cart-item-count"></span>
        </div>

        <div id="profil">
        <i class="ri-user-line"></i> 
        </div>

        </div>

    </div>

    <div class="cart-modal">
        <h2 class="cart-title">Your Cart</h2>

        <div class="cart-content">
            <!-- <div class="cart-box">
                <img src="/Assets/tote_bag.webp" class="cart-img" alt="Gambar tote bag bagus">
                <div class="cart-detail">
                    <h2 class="cart-product-title">Tote Bag</h2>
                    <span class="cart-price">$20.00</span>
                    <div class="cart-quantity">
                        <button id="decrement">-</button>
                        <span class="number">1</span>
                        <button id="increment">+</button>

                    </div>
                </div>
                <i class="ri-delete-bin-line cart-remove"></i>

            </div> -->

        </div>

        <div class="total">
                <div class="total-title">Total</div>
                <div class="total-price">$0</div>
            </div>
            <button class="btn-buy">Buy Now</button>
            <i class="ri-close-line" id="cart-close"></i>

    </div>

    <div class="advert">

        <h1>Your place to buy an eco-friendly products</h1>

    </div>

    <div class="header-catalog">

        <h2>Shop Best Sellers</h2>
        <p>Discover our most loved eco-friendly products.</p>

    </div>

    <div class="controls-container">
        <select id="category-filter">
            <option value="all">Semua Kategori</option>
        </select>
        <select id="sort-filter">
            <option value="default">Urutkan: Default</option>
            <option value="price-asc">Harga: Termurah</option>
            <option value="price-desc">Harga: Termahal</option>
            <option value="rating-desc">Rating: Tertinggi</option>
        </select>
    </div>
    
    <div id="catalog" class="catalog"> </div>

    <div class="load-more-container">
        <button id="load-more-btn" style="display: none;">Load More</button>
    </div>

    <div id="product-modal" class="product-modal">
        <div class="product-modal-content">
            <span class="close-modal" id="close-product-modal">&times;</span>
            <div id="product-modal-body"></div>
        </div>
    </div>

    <script src="catalog.js" defer></script>
    <script src="modal.js" defer></script>
</body>
</html>
