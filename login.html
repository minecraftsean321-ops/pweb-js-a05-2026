<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Sign In | TerraGoods</title>

    <!-- CSS -->
    <link rel="stylesheet" href="login.css" />

    <!-- JavaScript -->
    <script src="login.js" defer></script>
  </head>

  <body>
    <!-- Header -->
    <header class="top-bar">
      <p>Natural Living • Thoughtfully Made</p>
    </header>

    <!-- Login Page -->
    <main class="login-page">
      <!-- Brand -->
      <div class="brand">
        <span class="brand-text">TerraGoods</span>
      </div>

      <!-- Login Card -->
      <section class="login-card">
        <!-- Heading -->
        <div class="login-heading">
          <p class="eyebrow">WELCOME BACK</p>

          <h1>Sign in</h1>

          <p class="subtitle">Sign in to continue your TerraGoods journey.</p>
        </div>

        <!-- Login Form -->
        <form id="loginForm" novalidate>
          <!-- Username -->
          <div class="form-group">
            <label for="username"> Username </label>

            <input
              type="text"
              id="username"
              name="username"
              placeholder="Enter your username"
              autocomplete="username"
              required
            />
          </div>

          <!-- Password -->
          <div class="form-group">
            <label for="password"> Password </label>

            <div class="password-wrapper">
              <input
                type="password"
                id="password"
                name="password"
                placeholder="Enter your password"
                autocomplete="current-password"
                required
              />

              <button type="button" id="togglePassword" class="show-password">
                Show
              </button>
            </div>
          </div>

          <!-- Error / Success Message -->
          <p id="message" class="message" role="alert"></p>

          <!-- Sign In Button -->
          <button type="submit" id="loginButton" class="login-button">
            <span id="buttonText"> Sign in </span>

            <!-- Loading Spinner -->
            <span id="loader" class="loader" aria-hidden="true"></span>
          </button>
        </form>
      </section>
    </main>

    <!-- Footer -->
    <footer class="footer">
      <p>© 2026 TerraGoods</p>
    </footer>
  </body>
</html>
